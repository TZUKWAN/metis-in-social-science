name: Quality gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Audit, type-check, and lint
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  tests:
    name: Tests (${{ matrix.group }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: engine-library
            paths: engine
          - group: engine-integration
            paths: tests/engine tests/evals tests/lib tests/utils
          - group: frontend
            paths: tests/frontend
          - group: electron-and-e2e
            paths: tests/electron tests/e2e tests/scripts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild SQLite for Node.js
        run: npm run rebuild:node
      - name: Run test group
        run: npx vitest run ${{ matrix.paths }}

  build:
    name: Electron production build
    needs: quality
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
